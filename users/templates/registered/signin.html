{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    

        <form method="post" action="" class="w-1/2 max-w-sm mx-auto my-5 bg-white p-8 rounded-lg shadow-md">
        {% csrf_token %}
        <h2 class="text-2xl text-[#333399] font-bold mb-4">Sign in</h2>
        
        <input type="text" name="username" placeholder="Enter username" class="w-full px-4 py-2 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">

        <input type="password" name="password" placeholder="Enter password" class="w-full px-4 py-2 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">

        <button type="submit" class="card_tab text-white mt-2">Sign In</button>
    </form>



</body>
</html>
