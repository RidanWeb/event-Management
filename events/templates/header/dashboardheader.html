{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Dashboard{% endblock title %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+Bengali:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 0;
        outline: none;
      }
    </style>
  </head>
  <body class="bg-gray-50">

    <!-- Header start -->
    <header class="bg-gradient-to-t from-[#3E0F8D] to-[#9564DD] text-white px-6 md:px-8 py-4 mb-8">
      <nav class="flex justify-between items-center relative">
        <!-- Title -->
        <h1 class="text-2xl font-semibold">Dashboard</h1>

        <!-- Right Side: Links (Desktop) + Bell + Avatar + Toggle (Mobile) -->
        <div class="flex items-center gap-3 md:gap-6">
          <!-- Desktop Menu -->
          <ul class="hidden md:flex items-center gap-5 text-base">
            <li><a href="{% url 'home' %}" class="hover:text-gray-200 transition-colors">Home</a></li>
            <li><a href="{% url 'create-event' %}" class="hover:text-gray-200 transition-colors">Create Event</a></li>
            <li><a href="{% url 'admin-dashboard' %}" class="hover:text-gray-200 transition-colors">Dashboard</a></li>
          </ul>

          <!-- Notification Bell -->
          <button class="p-2 rounded-full hover:bg-white/10 transition-colors text-white relative cursor-pointer" aria-label="Notifications">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"
              />
            </svg>
          </button>

          <!-- User Avatar -->
          <button class="w-9 h-9 bg-blue-500 rounded-full text-white font-semibold flex items-center justify-center cursor-pointer">
            B
          </button>

          <!-- Mobile Toggle Button (Visible on mobile only) -->
          <button
            id="mobile-menu-btn"
            type="button"
            class="md:hidden text-3xl px-2 focus:outline-none cursor-pointer leading-none text-white hover:text-gray-200"
            aria-label="Toggle Navigation"
          >
            &#9776;
          </button>
        </div>
      </nav>

      <!-- Mobile Dropdown Menu -->
      <div id="mobile-menu" class="hidden md:hidden border-t border-white/20 mt-4 pt-4">
        <ul class="flex flex-col w-1/2 ml-auto gap-3 text-white text-base text-right">
          <li><a href="{% url 'home' %}" class="block hover:text-gray-200">Home</a></li>
          <li><a href="{% url 'create-event' %}" class="block hover:text-gray-200">Create Event</a></li>
          <li><a href="{% url 'admin-dashboard' %}" class="block hover:text-gray-200">Dashboard</a></li>
        </ul>
      </div>
    </header>
    <!-- Header end -->

    {% block dashBody %}
    {% endblock dashBody %}

    <script src="{% static 'js/query.js' %}"></script>
  </body>
</html>
